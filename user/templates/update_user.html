{% extends 'base_user.html' %}

{% block content %}

<div style="
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );
    padding:40px;
">

    <div style="
        width:450px;
        background:rgba(255,255,255,0.15);
        backdrop-filter:blur(15px);
        padding:40px;
        border-radius:25px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
        color:white;
    ">

        <div style="
            text-align:center;
            margin-bottom:30px;
        ">

            <div style="
                width:90px;
                height:90px;
                background:white;
                color:#764ba2;
                border-radius:50%;
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:40px;
                margin:auto;
                margin-bottom:15px;
            ">
                👤
            </div>

            <h1 style="
                margin:0;
                font-size:32px;
            ">
                {{ user.username }}
            </h1>

            <p style="
                opacity:0.8;
                margin-top:5px;
            ">
                Edit Profile
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div style="margin-bottom:20px;">

                <label style="
                    display:block;
                    margin-bottom:8px;
                ">
                    First Name
                </label>

                {{ form.first_name }}

            </div>

            <div style="margin-bottom:20px;">

                <label style="
                    display:block;
                    margin-bottom:8px;
                ">
                    Last Name
                </label>

                {{ form.last_name }}

            </div>

            <div style="margin-bottom:20px;">

                <label style="
                    display:block;
                    margin-bottom:8px;
                ">
                    Username
                </label>

                {{ form.username }}

            </div>

            <div style="margin-bottom:25px;">

                <label style="
                    display:block;
                    margin-bottom:8px;
                ">
                    Email
                </label>

                {{ form.email }}

            </div>

            <button type="submit" style="
                width:100%;
                padding:14px;
                border:none;
                border-radius:12px;
                background:white;
                color:#764ba2;
                font-size:16px;
                font-weight:bold;
                cursor:pointer;
                transition:0.3s;
            ">

                บันทึก
            </button>

        </form>

        <a href="{% url 'home' %}" style="
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:white;
            opacity:0.9;
        ">

            ← กลับสู่หน้าโปรไฟล์
        </a>

    </div>

</div>

<style>

input{

    width:100%;
    padding:14px;

    border:none;

    border-radius:12px;

    outline:none;

    font-size:15px;

    background:rgba(255,255,255,0.9);

    margin-top:5px;
}

input:focus{

    box-shadow:0 0 10px rgba(255,255,255,0.7);
}

button:hover{

    transform:translateY(-2px);

    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

</style>

{% endblock %}
