<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background: linear-gradient(
                135deg,
                #ff9a9e,
                #fad0c4
            );
        }

        .login-container{

            width:350px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 10px 30px rgba(0,0,0,0.2);

        }

        .login-container h2{

            text-align:center;

            margin-bottom:30px;

            color:#333;
        }

        .input-group{

            margin-bottom:20px;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            color:#555;
        }

        .input-group input{

            width:100%;

            padding:12px;

            border:1px solid #ccc;

            border-radius:10px;

            outline:none;

            transition:0.3s;
        }

        .input-group input:focus{

            border-color:#2575fc;
        }

        .login-btn{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            background:#2575fc;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{

            background:#1b5fd6;
        }

        .register-link{

            text-align:center;

            margin-top:20px;
        }

        .register-link a{

            text-decoration:none;

            color:#2575fc;
        }

        .error{

            background:#ffdede;

            color:red;

            padding:10px;

            border-radius:10px;

            margin-bottom:20px;

            text-align:center;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h2>
            ระบบจัดการร้านค้า
        </h2>

        <form method="POST">

            {% csrf_token %}

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div class="register-link">

            <a href="/">
                สมัครสมาชิก
            </a>

        </div>

    </div>

</body>

</html>
