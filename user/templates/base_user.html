<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Page</title>

    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#ffffff,#f69bbe59);
        min-height:100vh;
    }

    /* NAVBAR */
    .navbar{
        background:#1e293b;
        color:white;
        padding:15px 30px;
        display:flex;
        justify-content:space-between;
        align-items:center;

        /* เพิ่มเงา */
        box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    .navbar a{
        color:white;
        text-decoration:none;
        margin-left:15px;
    }

    .navbar a:hover{
        color:#ffd166;
    }

    /* CONTENT */
    .content{
        max-width:1400px;
        margin:30px auto;
        padding:0 30px;
    }

    /* กำหนดระยะห่างให้หัวข้อ */
    .content h1{
        margin-bottom:20px;
    }

    .content hr{
        margin-bottom:30px;
        border:none;
        border-top:1px solid #ddd;
    }
/* Banner */
.banner{
    background:linear-gradient(135deg,#8511e3,#f78352);
    color:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    margin-bottom:40px;
}

.banner h1{
    font-size:38px;
    margin-bottom:10px;
}

.banner p{
    font-size:18px;
}

/* Dashboard */
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    margin:40px 0;
}

.dashboard-card{
    background:white;
    border-radius:18px;
    padding:25px;
    text-align:center;
    text-decoration:none;
    color:#222;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.dashboard-card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(0,0,0,.15);
}

.dashboard-card h3{
    margin-bottom:10px;
}

.dashboard-card h1{
    color:#6d28d9;
}

/* Search */
.search-box{
    margin:40px 0;
}

.search-box input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:16px;
}

/* Product Grid */
.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:25px;
}

/* Product Card */
.product-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-8px);
    box-shadow:0 18px 30px rgba(0,0,0,.15);
}

.product-card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.product-body{
    padding:20px;
}

.btn-cart{
    display:block;
    width:100%;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#6d28d9;
    color:white;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
}

.btn-cart:hover{
    background:#4c1d95;
}
    /* FOOTER */
    .footer{
        margin-top:40px;
        text-align:center;
        padding:20px;
        color:#666;
    }
</style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

    <div class="logo">
        🛒 My Shop
    </div>

    <div class="navbar-menu">
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
        <a href="{% url 'profile' %}">👤 Profile</a>
        <a href="{% url 'logout' %}">🚪 Logout</a>
    </div>

</div>

    <!-- CONTENT -->
    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 My Shop
    </div>

</body>

</html>
